name: Forge 1.20.1 Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '8.5'

    - name: Build with Gradle
      run: gradle build --no-daemon -Dorg.gradle.jvmargs=-Xmx2G

    - name: Upload built JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forge-1.20.1-Mod
        path: build/libs/*.jar
